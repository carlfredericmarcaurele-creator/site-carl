<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Carl-Frédéric</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=3">
  <style>
    body { background-color:#f5f5f5; }
    .content{display:flex; justify-content:center;}
    form{display:flex; flex-direction:column; gap:20px; width:400px; max-width:90%; background:#fff; padding:30px; border-radius:12px; box-shadow:0px 4px 10px rgba(0,0,0,0.2);}
    label{font-size:0.7rem; display:flex; flex-direction:column; gap:8px;}
    input, textarea{font-family:inherit; font-size:0.7rem; padding:10px; border:2px solid #333; border-radius:8px; width:100%; box-sizing:border-box;}
    textarea{resize:vertical; min-height:120px;}
    button{font-family:inherit; font-size:0.75rem; padding:12px; border:none; border-radius:8px; background:#333; color:#fff; cursor:pointer; transition:all 0.2s ease;}
    button:hover{background:#555;}
  </style>
</head>
<body>

<div class="navbar">
  <img src="svg/logo.png" alt="Logo Carl-Frédéric" class="logo" id="logo-link">
  <div class="menu-center">
    <a href="work.html" class="transition-link">Portfolio</a>
    <a href="quiestce.html" class="transition-link">Infos</a>
    <a href="contact.html" class="transition-link">Contact</a>
  </div>
  <div class="menu-right"></div>
</div>

<div class="content">
  <form action="https://formspree.io/f/mzzakznp" method="POST">
    <label>Nom : <input type="text" name="name" required></label>
    <label>Email : <input type="email" name="email" required></label>
    <label>Message : <textarea name="message" rows="5" required></textarea></label>
    <button type="submit">Envoyer</button>
  </form>
</div>

<footer>
  © Carl-Frédéric Marc-Aurèle
</footer>

<script src="site.js?v=2"></script>
</body>
</html>
