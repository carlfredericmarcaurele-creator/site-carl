  <style>
    .content { padding-left: 40px; padding-right: 40px; max-width: 1400px; margin: 0 auto; }

    /* --- Filtres --- */
    .filters { display: flex; justify-content: center; flex-wrap: wrap; gap: 4px 8px; margin-bottom: 36px; }
    .filters button {
      font-family: inherit; font-size: 0.7rem;
      background: none; border: none; color: var(--muted);
      padding: 10px 12px; cursor: pointer; transition: color 0.25s ease;
    }
    .filters button:hover { color: var(--ink); }
    .filters button.active { color: var(--ink); text-decoration: underline; text-underline-offset: 6px; }

    /* --- Grille de projets --- */
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 44px 28px; }
    .card { cursor: pointer; transition: opacity 0.45s ease, transform 0.45s ease; }
    .card.hidden { display: none; }
    .card.appear { opacity: 0; transform: translateY(12px); }
    .thumb { position: relative; aspect-ratio: 16 / 9; overflow: hidden; background: #111; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.7s ease, filter 0.7s ease; }
    .card:hover .thumb img { transform: scale(1.04); filter: brightness(0.7); }
    .play {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 0.7rem; opacity: 0; transition: opacity 0.4s ease;
    }
    .card:hover .play { opacity: 1; }
    .meta { padding-top: 14px; }
    .cat { font-size: 0.45rem; color: var(--muted); line-height: 1.6; }
    .title { font-weight: normal; font-size: 0.8rem; line-height: 1.5; margin: 8px 0 8px; }
    .credits { font-size: 0.5rem; line-height: 1.9; color: #555; }
    .credits em { font-style: normal; color: var(--muted); }

    /* --- Lecteur plein écran --- */
    .lightbox {
      position: fixed; inset: 0; background: rgba(0,0,0,0.94); z-index: 2000;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
    }
    .lightbox.open { opacity: 1; pointer-events: auto; }
    .player { width: min(92vw, calc(82vh * 16 / 9)); aspect-ratio: 16 / 9; }
    .player.vertical { width: min(92vw, calc(86vh * 9 / 16)); aspect-ratio: 9 / 16; }
    .player iframe { width: 100%; height: 100%; border: 0; display: block; }
    .close {
      position: absolute; top: 14px; right: 18px; background: none; border: none; color: #fff;
      font-family: inherit; font-size: 0.7rem; padding: 12px; cursor: pointer;
    }

    @media (max-width: 1000px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 600px) {
      .content { padding-left: 16px; padding-right: 16px; }
      .filters { margin-bottom: 24px; gap: 0; }
      .filters button { font-size: 0.5rem; padding: 10px 6px; }
      .grid { grid-template-columns: 1fr; gap: 34px; }
      .title { font-size: 0.75rem; }
      .play { display: none; }
    }
  </style>

    { cat: "docu",  title: "Grand Prix Cycliste", sub: "Stories from the Peloton", role: "Opérateur Cam, assistant monteur", prod: "Studio 76, Tarzan Studio",
      youtube: "BLpT4fPYhl0" },
    { cat: "event", title: "Crankworx", role: "Opérateur Cam, monteur", prod: "", image: "svg/thumbs/web/crankworx.jpg",
      vimeo: "1246306145/dd9aaeaa9f", thumb: V("2225665619-ebda1ab50785cc197e1833225913bb56d41388fdec01b16979f9eaabef5f8fba") },
    { cat: "docu",  title: "Parc des Sommets", sub: "Airplane mode", role: "Directeur photo, monteur", prod: "Peartree Productions", image: "svg/thumbs/web/parc-des-sommets.jpg",
      vimeo: "1236641388/736fb49c08", thumb: V("2213199090-cecdc106e8f144133a177ecd50e866cc6838f253d080a12aad61184ef1802530") },
    { cat: "event", title: "Monochrome", sub: "A STOMP Motion Picture", role: "Directeur photo, monteur", prod: "",
      youtube: "JHyjKFTA2MA" },
    { cat: "pub",   title: "Geep", role: "Opérateur Cam, monteur", prod: "", image: "svg/thumbs/web/geep.jpg",
      vimeo: "1178250828", thumb: V("2139797044-06ac195aa5b146798aa345d698a060b9dccc4dfcc5949f9d88198cd3d9ecb172") },
    { cat: "pub",   title: "Groupe Vu Media", role: "Opérateur Cam, monteur", prod: "", image: "svg/thumbs/web/groupe-vu-media.jpg",

    { cat: "event", title: "Scooter Gas — Spandex Hotness", sub: "Vidéoclip", role: "Opérateur Cam", prod: "",
      youtube: "rT3uqE7U0pg" },
    { cat: "docu",  title: "Faction Bikes", role: "Directeur photo", prod: "Peartree Productions",
      youtube: "tJUQmqZmOuA" },
    { cat: "pub",   title: "Northrich", sub: "Brand story", role: "Opérateur Cam", prod: "Peartree Productions",
      vimeo: "1241436988/bf569b5f15", thumb: V("2219450814-aa3be4c82d95bd25d7efd6cdaa775b1c9ce23c3fa47f5f3dc24dd88c825efb84") },

      vimeo: "1246305238/1add3a7187", thumb: V("2225664418-9b7e0307b7b23a914aa912fc25721ee7141947ae4074f594ffcde4ecc4e676c0") },
    { cat: "pub",   title: "Solnör", sub: "Aménagement — projet #1", role: "Réalisation, Opérateur Cam, montage", prod: "", image: "svg/thumbs/web/solnor.jpg",
      vimeo: "1210237732/0fe89ded07", thumb: V("2180067109-6a427a3894b75c18a8a82eed3914de6550e2e242d6901b423928a447ddaaa546") },

    // --- Sans numéro : après les projets classés ---
    { cat: "pub",   title: "Michelle Champagne — Demain Bromont", role: "Réalisation, Opérateur Cam, montage", prod: "", image: "svg/thumbs/web/michelle-champagne.jpg",
      vimeo: "1247375811/a5e8270357", thumb: V("2227128897-8e470c1da710a2d40da4777b9f0a472f5efb41be6d40e7d6a98317e22dfb2bba") },
    { cat: "event", title: "Club de ski de Bromont", role: "Réalisation, Opérateur Cam, montage", prod: "",

    { cat: "event", title: "Lemay Michaud — Corpo", role: "Opérateur Cam, monteur", prod: "Peartree Productions", image: "svg/thumbs/web/lemay-michaud.jpg",
      vimeo: "1201795978", thumb: V("2169218710-3fb3c46cff698cd01a66b63764f5600e164670ef51234d04df20fb18124feddb") },

    // --- Content (sans numéro : après les projets classés) ---
    { cat: "content", title: "Chlorophylle — GoVan", role: "", prod: "", vertical: true, image: "svg/thumbs/web/chlorophylle-govan.jpg",
      vimeo: "1229689705/92ac859016", thumb: V("2204411625-4bf3ff4c2ac57fbaa0d9fe60e78e71df1bc46e7f1695966c41f8d4a869194d01") },

    { cat: "content", title: "Peak Fuel — Course Hiver", role: "", prod: "", vertical: true, image: "svg/thumbs/web/peak-fuel-course.jpg",
      vimeo: "1199505831/285f41ee34", thumb: V("2166349991-fa78c14c65677bbb4370ec92f1c1c487f875dee2b29c5dc6c42b1c085924ccfd") },
    { cat: "content", title: "Stomp", sub: "Product 2026", role: "", prod: "", vertical: true, image: "svg/thumbs/web/stomp.jpg",
      vimeo: "1189851798", thumb: V("2154473683-3bcbb9ebae1153b25a66094cefaf030da708fbc71b5c8d902049c4ee99cdb49b") },
    { cat: "content", title: "Sunii — Road Trip", role: "", prod: "", vertical: true, image: "svg/thumbs/web/sunii-road-trip.jpg",
      vimeo: "1247371733/049c1c86ca", thumb: V("2227123135-10033eeb37b2543a4e13cae32cf205513e9595599e236a31f77a750f56d6e55e") },
    { cat: "content", title: "Sunii", role: "", prod: "", vertical: true,
      vimeo: "1247371679/cca67ca223", thumb: V("2227123277-2946e4e47468d1560c2f5dea420ff000c5af88187587e0111ec51cad8bee17bf") },
  ];

  const LABELS = { docu: "Docu", pub: "Pub", event: "Event", content: "Content" };
  const grid = document.getElementById("grid");

  function embedUrl(p) {
    if (p.youtube) return `https://www.youtube.com/embed/${p.youtube}?autoplay=1&rel=0`;
    const [id, h] = p.vimeo.split("/");
    return `https://player.vimeo.com/video/${id}?autoplay=1&title=0&byline=0&portrait=0${h ? "&h=" + h : ""}`;
  }

  PROJECTS.forEach(p => {
    const card = document.createElement("article");
    card.className = "card";
    card.dataset.cat = p.cat;
    const auto = p.youtube ? `https://i.ytimg.com/vi/${p.youtube}/maxresdefault.jpg` : p.thumb;
    const backup = p.youtube ? `https://i.ytimg.com/vi/${p.youtube}/hqdefault.jpg` : p.thumb;
    const credits = [
      p.role ? `<div>${p.role}</div>` : "",
      p.prod ? `<div><em>Prod :</em> ${p.prod}</div>` : ""
    ].join("");
    card.innerHTML = `
      <div class="thumb">
        <img alt="${p.title}" loading="lazy">
        <div class="play">▶ Voir</div>
      </div>
      <div class="meta">
        <div class="cat">${LABELS[p.cat]}${p.sub ? " · " + p.sub : ""}</div>
        <h2 class="title">${p.title}</h2>
        <div class="credits">${credits}</div>
      </div>`;
    // Vignette : la tienne (image) si elle existe, sinon celle de Vimeo/YouTube
    const img = card.querySelector(".thumb img");
    const tries = [p.image, auto, backup].filter(Boolean);
    img.onerror = () => { tries.shift(); if (tries.length) img.src = tries[0]; else img.remove(); };
    if (tries.length) img.src = tries[0]; else img.remove();
    card.addEventListener("click", () => openPlayer(p));
    grid.appendChild(card);
  });

  // --- Filtres ---
  document.querySelectorAll("#filters button").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("#filters button").forEach(b => b.classList.toggle("active", b === btn));
      const f = btn.dataset.filter;
      document.querySelectorAll(".card").forEach(c => {
        const show = f === "all" || c.dataset.cat === f;
        c.classList.toggle("hidden", !show);
        if (show) { c.classList.add("appear"); requestAnimationFrame(() => requestAnimationFrame(() => c.classList.remove("appear"))); }
      });
    });
  });

  // --- Lecteur ---
  const lightbox = document.getElementById("lightbox");
  const player = document.getElementById("player");
  function openPlayer(p) {
    player.className = "player" + (p.vertical ? " vertical" : "");
    player.innerHTML = `<iframe src="${embedUrl(p)}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`;
    lightbox.classList.add("open");
  }
  function closePlayer() { lightbox.classList.remove("open"); setTimeout(() => { player.innerHTML = ""; }, 400); }
  document.getElementById("close").addEventListener("click", closePlayer);
  lightbox.addEventListener("click", e => { if (e.target === lightbox) closePlayer(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closePlayer(); });
</script>
